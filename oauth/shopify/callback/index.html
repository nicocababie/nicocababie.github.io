<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Autorización de Shopify</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; color: #1a1a1a; background: #fff; }
    code { display: block; padding: .75rem; background: #f2f2f2; border-radius: .4rem; word-break: break-all; font-size: .95rem; }
    button { margin-top: .75rem; padding: .5rem 1rem; font-size: 1rem; cursor: pointer; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>Autorización de Shopify</h1>
  <div id="result"></div>
  <script>
    const params = new URLSearchParams(location.search);
    const result = document.getElementById("result");

    if (params.get("code") && params.get("hmac")) {
      result.innerHTML = '<p>Copiá esta URL completa y pegala en la terminal. Sirve una sola vez y vence en pocos minutos.</p><code id="url"></code><button id="copy">Copiar</button>';
      document.getElementById("url").textContent = location.href;
      document.getElementById("copy").onclick = async (event) => {
        await navigator.clipboard.writeText(location.href);
        event.target.textContent = "Copiado";
      };
    } else if (params.get("error")) {
      result.innerHTML = '<p class="error"></p>';
      result.firstChild.textContent = "Shopify devolvió un error: " + params.get("error") + " " + (params.get("error_description") ?? "");
    } else {
      result.innerHTML = "<p>No hay datos de autorización en la URL. Esta página solo se usa al instalar la app.</p>";
    }
  </script>
</body>
</html>
