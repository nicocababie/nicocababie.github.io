<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Autorización de Mercado Libre</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; color: #1a1a1a; background: #fff; }
    code { display: block; padding: .75rem; background: #f2f2f2; border-radius: .4rem; word-break: break-all; font-size: 1rem; }
    button { margin-top: .75rem; padding: .5rem 1rem; font-size: 1rem; cursor: pointer; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>Autorización de Mercado Libre</h1>
  <div id="result"></div>
  <script>
    const params = new URLSearchParams(location.search);
    const code = params.get("code");
    const error = params.get("error");
    const result = document.getElementById("result");

    if (code) {
      result.innerHTML = '<p>Copiá este código y pegalo en la terminal. Vence en pocos minutos y sirve una sola vez.</p><code id="code"></code><button id="copy">Copiar</button>';
      document.getElementById("code").textContent = code;
      document.getElementById("copy").onclick = async (event) => {
        await navigator.clipboard.writeText(code);
        event.target.textContent = "Copiado";
      };
    } else if (error) {
      result.innerHTML = '<p class="error"></p>';
      result.firstChild.textContent = "Mercado Libre devolvió un error: " + error + " " + (params.get("error_description") ?? "");
    } else {
      result.innerHTML = "<p>No hay código en la URL. Esta página solo se usa al autorizar la app.</p>";
    }
  </script>
</body>
</html>
